<!DOCTYPE html>
<html lang="zh">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>小野字幕君</title>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/mammoth/1.4.2/mammoth.browser.min.js"></script>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.min.js"></script>

    <style>
        :root {
          --header-height: 80px;
          --accent: #3b82f6; 
          --accent-dark: #0284c7; 
          --accent-light: #eff6ff; 
          --bg-color: #f4f9fd; 
          --border-color: #bfdbfe; 
          
          --subtitle-min-height: 30px;
          --gutter: 20px;
          --max-width: 960px; 
          --container-padding: 30px;
        }
        
        * {
          box-sizing: border-box;
        }
        
        html, body {
          height: 100%;
          margin: 0;
          padding: 0;
          font-family: "Georgia", "Times New Roman", "Noto Serif CJK TC", "Noto Serif CJK JP", serif; 
          background: var(--bg-color); 
          color: #1e293b;
        }
        
        /* 頂部導航 */
        .header {
          position: fixed;
          top: 0; left: 0; right: 0;
          height: var(--header-height);
          display: flex;
          align-items: center;
          justify-content: space-between;
          padding: 0 40px;
          background: #ffffff;
          z-index: 999;
          border-bottom: 1px solid var(--border-color);
          box-shadow: 0 4px 12px rgba(59, 130, 246, 0.05);
        }
        
        .header-left h1 { 
            margin: 0; font-size: 24px; color: var(--accent-dark); font-family: "Arial", sans-serif; font-weight: 800; letter-spacing: 1px; 
        }
        .header-left p { 
            margin: 4px 0 0 0; font-size: 12px; color: #64748b; font-family: sans-serif; 
        }
        
        .file-search-container { display: flex; gap: 12px; align-items: center; }
        .search-box { 
            padding: 8px 12px; border-radius: 4px; border: 1px solid #cbd5e1; font-size: 13px; width: 220px; outline: none; background: #ffffff;
        }
        .search-box:focus { border-color: var(--accent); box-shadow: 0 0 0 2px rgba(59, 130, 246, 0.2); }
        
        input[type="file"]::file-selector-button {
          padding: 8px 16px; border-radius: 4px; border: 1px solid #cbd5e1;
          background: #ffffff; color: #475569; font-size: 13px; cursor: pointer; transition: 0.2s;
        }
        input[type="file"]::file-selector-button:hover { background: var(--accent-light); border-color: var(--border-color); }
        
        .bilingual-btn { background: #ffffff; color: #475569; border: 1px solid #cbd5e1; padding: 8px 16px; border-radius: 4px; cursor: pointer; font-size: 13px; }
        .bilingual-btn.active { background: var(--accent); color: #fff; border-color: var(--accent); }
        
        /* 主內容區 */
        main {
          padding: calc(var(--header-height) + 40px) var(--container-padding) 140px;
          max-width: var(--max-width);
          margin: 0 auto;
        }
        
        /* 雙欄佈局核心 */
        .row {
          display: block;
          margin-bottom: 0;
        }
        
        .subtitle {
          padding: 20px 0;
          display: flex;
          flex-direction: row;
          align-items: stretch;
          border-bottom: 1px solid #e2e8f0; 
          background: transparent;
          transition: background 0.2s ease;
        }
        .subtitle:hover {
          background: #ffffff;
          border-radius: 8px;
          box-shadow: 0 2px 8px rgba(0,0,0,0.02);
        }
        
        /* 左側文字框 */
        .text-box {
          flex: 7.5; 
          padding: 0 30px 0 0;
          background: transparent;
          border: none;
          border-right: 2px solid #93c5fd; 
          border-radius: 0;
          display: flex;
          flex-direction: column;
          justify-content: center;
          cursor: text;
        }
        
        .japanese-text {
          font-size: 18px;
          line-height: 1.7;
          color: #0f172a;
          margin-bottom: 8px;
          word-break: break-word;
        }
        
        .chinese-text {
          font-family: "Arial", "Microsoft YaHei", sans-serif;
          font-size: 14.5px;
          line-height: 1.6;
          color: #64748b; 
        }
        
        .single-language .chinese-text { display: none; }
        .single-language .japanese-text { margin-bottom: 0; }
        
        /* 右側筆記區 */
        .note-area {
          flex: 2.5; 
          padding-left: 20px;
          display: flex;
          flex-direction: column;
          justify-content: center; 
          position: relative;
        }
        
        .note-container {
          width: 100%;
          display: none;
        }
        .note-container.has-note, .subtitle:hover .note-container {
          display: flex; 
        }
        
        .note-box {
          width: 100%;
          min-height: 30px;
          padding: 6px;
          background: transparent;
          border: 1px solid transparent; 
          border-radius: 4px;
          font-size: 14.5px;
          font-family: inherit;
          line-height: 1.5;
          color: #0284c7; 
          font-weight: 500;
          resize: none;
          overflow: hidden;
          transition: 0.2s;
        }
        .note-box::placeholder {
          color: #94a3b8;
          font-style: italic;
        }
        .note-box:focus {
          outline: none;
          background: var(--accent-light);
          border: 1px dashed #93c5fd; 
        }
        
        .print-note-text { display: none; }
        
        /* 底部工具列 */
        .button-container {
          position: fixed; bottom: 30px; right: 40px; display: flex; gap: 12px; z-index: 100;
        }
        .import-btn, .export-btn, .export-pdf-btn {
          padding: 12px 20px; font-size: 14px; border: none; border-radius: 6px; cursor: pointer; color: #fff; font-weight: bold; box-shadow: 0 4px 10px rgba(0,0,0,0.1); transition: 0.2s;
        }
        .import-btn { background: #64748b; }
        .export-btn { background: #0ea5e9; } 
        .export-pdf-btn { background: var(--accent); }
        .import-btn:hover, .export-btn:hover, .export-pdf-btn:hover { transform: translateY(-2px); box-shadow: 0 6px 12px rgba(0,0,0,0.15); }
        
        /* 狀態指示 */
        .global-status, .file-info {
          position: fixed; background: #1e293b; color: #fff; padding: 8px 16px; border-radius: 4px; font-size: 13px; z-index: 1000; display: none;
        }
        .global-status { top: calc(var(--header-height) + 15px); right: 40px; }
        .global-status.show { display: block; }
        .file-info { bottom: 40px; left: 40px; }
        
        .progress-container { position: fixed; top: var(--header-height); left: 0; right: 0; height: 3px; background: transparent; z-index: 999; display: none; }
        .progress-bar { height: 100%; background: var(--accent); width: 0%; transition: width 0.3s ease; }
        
        .highlight { background: rgba(253, 224, 71, 0.6); border-radius: 2px; padding: 0 2px; }
        
        /* ==================== 手機版響應式 RWD (不變形、不跑版) ==================== */
        @media (max-width: 900px) {
          :root {
            --header-height: auto;
            --container-padding: 15px;
          }
          .header {
            position: relative; flex-direction: column; align-items: flex-start; padding: 20px; gap: 15px;
          }
          .file-search-container {
            flex-direction: column; align-items: stretch; width: 100%;
          }
          .search-box { width: 100%; }
          main { padding-top: 20px; }
          
          /* 雙欄改為上下排列 */
          .subtitle { flex-direction: column; padding: 15px; }
          .text-box {
            padding: 0 0 15px 0; border-right: none; border-bottom: 2px dashed #93c5fd; 
          }
          .note-area { padding: 15px 0 0 0; }
          
          /* 底部按鈕滿版適配 */
          .button-container { bottom: 15px; right: 15px; left: 15px; justify-content: space-between; }
          .import-btn, .export-btn, .export-pdf-btn { flex: 1; padding: 12px 10px; font-size: 13px; text-align: center; }
        }

        /* PDF 列印排版 */
        @media print {
          @page { size: A4; margin: 20mm 15mm; }
          body { background: #fff !important; color: #000 !important; font-size: 11pt; }
          .header, .button-container, .file-info, .global-status, .progress-container { display: none !important; }
          main { padding: 0 !important; max-width: 100% !important; }
          .row { margin-bottom: 0 !important; page-break-inside: avoid; }
          .subtitle { padding: 15px 0 !important; border-bottom: 1px solid #e2e8f0 !important; }
          .text-box { flex: 7.5 !important; padding-right: 20px !important; border-right: 1.5px solid #94a3b8 !important; }
          .japanese-text { font-size: 14pt !important; line-height: 1.6 !important; color: #000 !important; }
          .chinese-text { font-size: 10.5pt !important; color: #475569 !important; }
          .note-area { flex: 2.5 !important; padding-left: 15px !important; }
          .note-container { display: none !important; }
          .print-note-text {
            display: block !important; font-size: 11pt !important; line-height: 1.5 !important; color: #0284c7 !important; white-space: pre-wrap; word-break: break-word;
          }
        }
    </style>
</head>

<body>
    <header class="header">
        <div class="header-left">
            <h1>小野字幕君</h1>
            <p>完整支援：srt / ass / docx / txt / pdf</p>
        </div>
        <div class="file-search-container">
            <input id="fileInput" type="file" accept=".ass,.srt,.docx,.txt,.pdf" />
            <input id="searchBox" class="search-box" type="text" placeholder="輸入搜尋內容..." />
            <button id="bilingualBtn" class="bilingual-btn active">單語/雙語切換</button>
        </div>
    </header>

    <div class="progress-container" id="progressContainer"><div class="progress-bar" id="progressBar"></div></div>
    <div class="global-status" id="globalStatus"></div>
    <div class="file-info" id="fileInfo"></div>

    <div class="button-container">
        <button class="import-btn" id="importBtn">導入備份</button>
        <button class="export-btn" id="exportBtn" style="display:none;">備份 HTML</button>
        <button class="export-pdf-btn" id="exportPdfBtn" style="display:none;">🖨️ 匯出 PDF 講義</button>
    </div>
    <input type="file" id="importFileInput" accept=".html" style="display:none" />

    <main>
        <div id="subtitles"></div>
    </main>

    <script>
        let currentFileName = null;
        let allSubtitles = []; 
        let processedSubtitles = []; 
        let notesData = {};
        let noteCount = 0;
        let bilingualEnabled = true; 
        
        function escapeHtml(s) { return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;'); }
        
        function updateFileInfo(msg, duration = 3000) {
          const fileInfo = document.getElementById('fileInfo');
          fileInfo.textContent = msg; fileInfo.style.display = 'block';
          if (duration > 0) setTimeout(() => fileInfo.style.display = 'none', duration);
        }
        function showGlobalStatus(msg, duration = 2000) {
          const status = document.getElementById('globalStatus');
          status.textContent = msg; status.classList.add('show');
          setTimeout(() => status.classList.remove('show'), duration);
        }
        function updateProgress(percent, msg = '') {
          document.getElementById('progressContainer').style.display = 'block';
          document.getElementById('progressBar').style.width = percent + '%';
          if (msg) updateFileInfo(msg);
          if (percent >= 100) setTimeout(() => document.getElementById('progressContainer').style.display = 'none', 500);
        }
        
        function updateNoteCount() {
          const validNotes = Object.values(notesData).filter(v => v.trim() !== '');
          noteCount = validNotes.length;
          const display = noteCount > 0 ? 'block' : 'none';
          document.getElementById('exportBtn').style.display = display;
          document.getElementById('exportPdfBtn').style.display = display; 
        }
        
        function autoResizeTextarea(textarea) {
          textarea.style.height = '30px';
          textarea.style.height = Math.max(textarea.scrollHeight, 30) + 'px';
        }

        function isJapaneseText(text) { return /[\u3040-\u309F\u30A0-\u30FF\u4E00-\u9FAF]/.test(text || ''); }
        function isChineseText(text) { return /[\u4E00-\u9FAF]/.test(text || '') && !/[\u3040-\u309F\u30A0-\u30FF]/.test(text || ''); }
        
        function processBilingualSubtitles(subtitles) {
          const processed = [];
          if (subtitles.length > 0 && subtitles[0].startTime) {
             const timeMap = {};
             subtitles.forEach((sub, i) => {
                 const key = `${sub.startTime}-${sub.endTime}`;
                 if(!timeMap[key]) timeMap[key] = [];
                 timeMap[key].push(sub.text);
             });
             Object.values(timeMap).forEach(texts => {
                 if(texts.length === 1) {
                     processed.push({ japanese: isJapaneseText(texts[0])?texts[0]:'', chinese: isChineseText(texts[0])?texts[0]:'', isBilingual: false });
                 } else {
                     const jp = isJapaneseText(texts[0]) ? texts[0] : texts[1];
                     const zh = isChineseText(texts[0]) ? texts[0] : texts[1];
                     processed.push({ japanese: jp, chinese: zh, isBilingual: true });
                 }
             });
          } else {
             let i = 0;
             while (i < subtitles.length) {
               const cur = subtitles[i];
               if (i === subtitles.length - 1) {
                 processed.push({ japanese: isJapaneseText(cur.text) ? cur.text : '', chinese: isChineseText(cur.text) ? cur.text : '', isBilingual: false });
                 break;
               }
               const next = subtitles[i + 1];
               if (isJapaneseText(cur.text) && isChineseText(next.text)) {
                 processed.push({ japanese: cur.text, chinese: next.text, isBilingual: true }); i += 2;
               } else if (isChineseText(cur.text) && isJapaneseText(next.text)) {
                 processed.push({ japanese: next.text, chinese: cur.text, isBilingual: true }); i += 2;
               } else {
                 processed.push({ japanese: isJapaneseText(cur.text) ? cur.text : '', chinese: isChineseText(cur.text) ? cur.text : '', isBilingual: false }); i++;
               }
             }
          }
          return processed;
        }

        function parseSRT(c) {
          return c.replace(/\r/g,'').split(/\n\n+/).map((b,i) => {
            const l = b.split('\n').filter(x=>x.trim()!=='');
            if(l.length>=3){
               const m = l[1].match(/(\d{2}:\d{2}:\d{2},\d{3})\s*-->\s*(\d{2}:\d{2}:\d{2},\d{3})/);
               return { index:i, startTime:m?m[1]:'', endTime:m?m[2]:'', text:l.slice(2).join(' ') };
            } return null;
          }).filter(x=>x);
        }
        function parseASS(c) {
          return c.replace(/\r/g,'').split('\n').filter(l=>l.trim().startsWith('Dialogue:'))
            .map((l,i)=>{ const p=l.split(','); return {index:i, startTime:p[1]||'', endTime:p[2]||'', text:p.slice(9).join(',').replace(/\\N/g,' ').replace(/\{.*?\}/g,'').trim()}; }).filter(x=>x.text);
        }
        function parseTXT(c) { return c.split('\n').map(l=>l.trim()).filter(l=>l!=='').map((l,i)=>({index:i, text:l})); }

        function renderAllSubtitles(subtitles) {
          const container = document.getElementById('subtitles');
          let html = '';
          subtitles.forEach((sub, i) => {
            const note = notesData[i] || '';
            html += `
              <div class="row" data-index="${i}">
                <div class="subtitle">
                  <div class="text-box" data-original="${escapeHtml(sub.japanese || '')}">
                    <div class="japanese-text">${escapeHtml(sub.japanese || '')}</div>
                    ${sub.chinese ? `<div class="chinese-text">${escapeHtml(sub.chinese)}</div>` : ''}
                  </div>
                  <div class="note-area">
                    <div class="note-container has-note">
                      <textarea class="note-box" data-index="${i}" placeholder="在這裡輸入筆記...">${escapeHtml(note)}</textarea>
                    </div>
                    <div class="print-note-text" id="print-note-${i}">${escapeHtml(note)}</div>
                  </div>
                </div>
              </div>`;
          });
          container.innerHTML = html;
          
          container.querySelectorAll('.note-box').forEach(box => {
            const idx = box.dataset.index;
            const printMirror = document.getElementById(`print-note-${idx}`);
            box.addEventListener('input', function() {
              autoResizeTextarea(this);
              notesData[idx] = this.value;
              printMirror.textContent = this.value; 
              updateNoteCount();
            });
            box.addEventListener('focus', function() { autoResizeTextarea(this); });
            if(box.value.trim()) autoResizeTextarea(box);
          });
          
          if (!bilingualEnabled) document.body.classList.add('single-language');
        }

        // ==================== 【檔案上傳核心：二進位修復版】 ====================
        document.getElementById('fileInput').addEventListener('change', function(e) {
          const file = e.target.files[0]; if(!file) return;
          const ext = file.name.split('.').pop().toLowerCase();
          currentFileName = file.name;
          updateProgress(10, '正在讀取檔案...');
          
          const reader = new FileReader();
          
          // 如果是 Word 或 PDF 二進位結構檔案
          if (ext === 'docx' || ext === 'pdf') {
              reader.onload = async (ev) => {
                  const buffer = ev.target.result;
                  let subs = [];
                  try {
                      if (ext === 'docx') {
                          updateProgress(40, '正在解析 Word 檔案...');
                          const result = await mammoth.extractRawText({ arrayBuffer: buffer });
                          subs = parseTXT(result.value);
                      } else if (ext === 'pdf') {
                          updateProgress(30, '正在初始化 PDF 引擎...');
                          if (typeof pdfjsLib !== 'undefined') {
                              // 初始化 PDF.js Background Worker 
                              pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.worker.min.js';
                              const loadingTask = pdfjsLib.getDocument({ data: buffer });
                              const pdf = await loadingTask.promise;
                              let fullText = "";
                              
                              for (let i = 1; i <= pdf.numPages; i++) {
                                  updateProgress(30 + Math.floor((i / pdf.numPages) * 50), `正在提取 PDF 第 ${i}/${pdf.numPages} 頁...`);
                                  const page = await pdf.getPage(i);
                                  const textContent = await page.getTextContent();
                                  
                                  // 智慧型重組 PDF 換行，避免破碎排版
                                  let lastY, pageText = '';
                                  for (let item of textContent.items) {
                                      if (lastY !== undefined && Math.abs(item.transform[5] - lastY) > 5) {
                                          pageText += '\n';
                                      }
                                      pageText += item.str;
                                      lastY = item.transform[5];
                                  }
                                  fullText += pageText + '\n';
                              }
                              subs = parseTXT(fullText);
                          } else {
                              throw new Error('PDF.js 解析庫加載失敗，請檢查網路連線。');
                          }
                      }
                      
                      if(subs.length > 0) {
                          allSubtitles = subs;
                          processedSubtitles = processBilingualSubtitles(subs);
                          renderAllSubtitles(processedSubtitles);
                          updateProgress(100, '檔案解析完成');
                      } else {
                          updateProgress(0, '提取失敗');
                          alert('未能從該檔案中找到任何可讀取的純文字。若為 PDF，請確認它不是掃描圖檔。');
                      }
                  } catch (err) {
                      console.error(err);
                      updateProgress(0, '解析出錯');
                      alert('檔案解析失敗，錯誤原因: ' + err.message);
                  }
              };
              reader.readAsArrayBuffer(file); // 關鍵：改用二進位讀取
          } else {
              // 影音純文字檔案
              reader.onload = (ev) => {
                 let subs = [];
                 if(ext === 'srt') subs = parseSRT(ev.target.result);
                 else if(ext === 'ass') subs = parseASS(ev.target.result);
                 else if(ext === 'txt') subs = parseTXT(ev.target.result);
                 
                 if(subs.length > 0) {
                     allSubtitles = subs;
                     processedSubtitles = processBilingualSubtitles(subs);
                     renderAllSubtitles(processedSubtitles);
                     updateProgress(100, '純文字字幕解析完成');
                 } else {
                     updateProgress(0, '解析失敗');
                     alert('未能成功解析該字幕內容。');
                 }
              };
              reader.readAsText(file, 'utf-8');
          }
        });

        document.getElementById('bilingualBtn').addEventListener('click', function() {
          bilingualEnabled = !bilingualEnabled;
          this.classList.toggle('active');
          document.body.classList.toggle('single-language');
        });
        
        document.getElementById('searchBox').addEventListener('input', function() {
          const q = this.value.trim().toLowerCase();
          document.querySelectorAll('.row').forEach(row => {
            row.style.display = row.textContent.toLowerCase().includes(q) ? 'block' : 'none';
          });
        });
        
        // 導入備份
        document.getElementById('importBtn').addEventListener('click', function() {
          if (processedSubtitles.length === 0) {
            alert('請先上傳您的學習檔案（Word/PDF/字幕），才能導入與其對應的筆記備份！');
            return;
          }
          document.getElementById('importFileInput').click(); 
        });
        
        document.getElementById('importFileInput').addEventListener('change', function(e) {
            const file = e.target.files[0]; if (!file) return;
            const reader = new FileReader();
            reader.onload = (ev) => {
                const doc = new DOMParser().parseFromString(ev.target.result, 'text/html');
                const items = doc.querySelectorAll('.export-item');
                let count = 0;
                items.forEach(item => {
                    const subtitleEl = item.querySelector('.export-note-subtitle');
                    const contentEl = item.querySelector('.export-note-content');
                    if (subtitleEl && contentEl) {
                        const jaText = subtitleEl.textContent.trim();
                        const note = contentEl.textContent.trim();
                        const idx = processedSubtitles.findIndex(s => s.japanese === jaText);
                        if (idx !== -1) {
                            notesData[idx] = note;
                            count++;
                        }
                    }
                });
                if (count > 0) {
                    renderAllSubtitles(processedSubtitles);
                    updateNoteCount();
                    showGlobalStatus(`✅ 成功導入 ${count} 條筆記！`);
                } else {
                    showGlobalStatus('❌ 未找到與目前文字相符的備份內容');
                }
                e.target.value = '';
            };
            reader.readAsText(file, 'utf-8');
        });

        // 導出備份 HTML
        document.getElementById('exportBtn').addEventListener('click', function() {
            const validNotes = Object.entries(notesData).filter(([k, v]) => v && v.trim() !== '');
            let listHtml = validNotes.map(([i, note]) => `
                <div class="export-item" style="margin-bottom:20px; padding:15px; border:1px solid #cce4f7; border-radius:8px; background:#f4f9fd;">
                    <div class="export-note-subtitle" style="font-weight:bold; color:#0284c7; font-size:18px;">${escapeHtml(processedSubtitles[i].japanese)}</div>
                    <div style="color:#64748b; font-size:14px; margin:6px 0;">${escapeHtml(processedSubtitles[i].chinese || '')}</div>
                    <div class="export-note-content" style="background:#fff; padding:10px; border-left:4px solid #3b82f6; color:#0f172a; margin-top:10px; line-height:1.5;">${escapeHtml(note)}</div>
                </div>`).join('');
            
            const html = `<!doctype html><html><head><meta charset="utf-8"><title>學習筆記備份</title></head><body style="max-width:800px; margin:40px auto; font-family:sans-serif; padding:0 20px;"><h2>學習筆記本</h2><hr style="border:none; border-top:1px solid #bfdbfe; margin-bottom: 20px;" />${listHtml}</body></html>`;
            const blob = new Blob([html], { type: 'text/html;charset=utf-8' });
            const a = document.createElement('a'); 
            a.href = URL.createObjectURL(blob); 
            a.download = `小野字幕君_筆記備份.html`; 
            a.click();
        });

        // 導出 PDF 講義
        document.getElementById('exportPdfBtn').addEventListener('click', function() {
            showGlobalStatus('正在呼叫列印介面，請選擇「另存為 PDF」', 4000);
            setTimeout(() => { window.print(); }, 500);
        });
    </script>
</body>
</html>
